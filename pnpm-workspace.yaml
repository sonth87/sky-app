packages:
  - apps/*
  - packages/*
  - modules/*

catalog:
  # Khai báo 1 lần duy nhất — 4 package.json (device-shell, module-ceremony, shell-electron,
  # shell-web) tham chiếu qua "catalog:" thay vì ghi version cụ thể, tránh phải sửa 4 chỗ mỗi
  # lần cập nhật device-layout (phát hiện qua bất tiện thật, 2026-07-21).
  #
  # v0.2.10 — sửa bug thật phát hiện 2026-07-21: isSimpleMode dạng object custom (không phải
  # true/false) khiến field KHÔNG khai báo tường minh (VD dock/iconGrid) mặc định TẮT, và
  # `iconGrid` là nơi DUY NHẤT render icon mở app trên desktop macOS theme (tên field gây hiểu
  # lầm — nghe như chỉ "sắp xếp icon" nhưng thực chất quyết định "có hiện icon app hay không") —
  # nếu tắt cả dock lẫn iconGrid, không còn cách nào mở app qua UI. User đã tự sửa ở repo gốc
  # /Users/skyline/PROJECTS/device-layout, release v0.2.10 "Fix iconGrid default, builtInApps
  # prop & liveWallpapers customization". Trước đó là v0.2.7 (colorScheme prop, Simple Mode
  # config, full-screen exit fix, menu bar customization) — xem git log repo đó để chi tiết.
  # Đã thử nghiệm 2026-07-21: đổi về v0.2.4 KHÔNG sửa được UI vỡ (mất padding/spacing) — xác
  # nhận KHÔNG phải do version device-layout, giữ v0.2.10 (bản đúng ý user).
  #
  # v0.3.0 (2026-07-23) — thêm EditContextMenu: menu chuột-phải Copy/Paste/Cut/Undo/Redo/
  # Select All/Save Image tự vẽ, thay cho preventDefault() vô điều kiện ở ThemeProvider's root
  # div trước đây (bug thật: chặn cả context menu Copy/Paste trong input của app con, ví dụ
  # EventGate.tsx). Kèm prop mới `resolveEditContextMenuItems` cho host toàn quyền tuỳ biến danh
  # sách item theo target — xem docs/integration.md's "Edit context menu" ở repo device-layout.
  #
  # v0.3.1 (2026-07-23) — fix bug thật phát hiện ngay sau khi dùng v0.3.0: click ra ngoài menu
  # không tắt được (phải bấm đúng 1 menu item mới tắt). Nguyên nhân: ContextMenu.Root chạy
  # uncontrolled, state `entries` nội bộ của EditContextMenu không đồng bộ với việc Radix tự đóng
  # Content qua click-outside/Escape — đã nối `onOpenChange` để dọn state đúng lúc.
  #
  # v0.3.2 (2026-07-23) — fix tiếp: v0.3.1 chỉ hết bug khi click ra ngoài TRONG CÙNG app/window;
  # click sang app/window KHÁC (vd Ceremony khi menu đang mở ở TTS Studio) vẫn không tắt được,
  # thậm chí có lúc kẹt không click được gì nữa. Nguyên nhân kép: (1) Window.tsx gọi
  # stopPropagation() trên pointerdown để focus window, chặn mất native event trước khi tới
  # Radix's bubble-phase outside-click listener nếu click rơi vào window khác; (2) khi tự đóng
  # bằng capture-phase listener riêng, Radix's internal `open` không biết, và modal={true} mặc
  # định của nó áp pointer-events:none lên toàn app cho tới khi state đó về false — khoá luôn mọi
  # tương tác. Đã thêm capture-phase pointerdown listener riêng (không phụ thuộc bubble-phase) +
  # modal={false} (tắt hẳn cơ chế khoá pointer-events global của Radix).
  #
  # v0.3.3 (2026-07-23) — fix TẬN GỐC: hoá ra Window.tsx's stopPropagation() vô điều kiện chặn
  # click-outside của MỌI component Radix dùng DismissableLayer (Select, DropdownMenu, Popover...)
  # không riêng context menu tự viết — phát hiện qua VoicePicker's dropdown (Select) ở TTS Studio
  # không tự đóng khi click ra ngoài, kể cả trong CÙNG window. IconGrid.tsx's marquee-select đã tự
  # loại trừ click trong window qua target.closest('[id^="window-"]'), không phụ thuộc
  # stopPropagation() này — không tìm thấy chỗ nào khác cần nó. Đã sửa: chỉ stopPropagation() khi
  # window CHƯA focused (lần click đầu để focus), mọi click sau đó nổi bọt bình thường.
  #
  # v0.5.1 (2026-07-28) — fix thật phát hiện sau khi dùng v0.5.0: (1) FloatingWindow's resize
  # phình ra cả 2 phía quanh tâm thay vì chỉ về phía đang kéo (do vẫn center-by-flex trong lúc
  # đổi size) — fix bằng cách neo góc trên-trái tại vị trí thật ngay khi bắt đầu kéo/resize,
  # chuyển sang absolute position từ đó; (2) bỏ icon SVG xấu ở góc resize, giữ hitbox; (3)
  # MenuBarExtraButton's popover giờ tự đóng khi bấm 1 mục hành động (khớp MenuDropdown) — trước
  # đó bấm "Xem log" mở FloatingWindow (z 99999) trong khi popover (z 9999) vẫn đứng yên phía
  # sau, trông như cửa sổ log "đè" lên menu.
  #
  # v0.5.2 (2026-07-28) — fix thật phát hiện ngay sau khi test v0.5.1: MenuBarExtraButton's
  # popover (z-[9999]) thấp hơn FloatingWindow (zIndex 99999) — số z-index khác nhau quyết
  # định thứ tự vẽ (không phải thứ tự DOM), nên cửa sổ mở từ popover (vd EngineManager) LUÔN
  # vẽ đè lên popover bất kể đóng/mở lại kiểu gì — không phải lỗi trạng thái đóng-khi-bấm-mục
  # (v0.5.1 đã có, vẫn đúng, giữ nguyên) mà là lỗi stacking riêng. Bump popover lên z-[100000]
  # (menu bar macOS thật luôn nổi trên mọi cửa sổ app).
  #
  # v0.5.3 (2026-07-30) — thêm AppSlice.updateAppConfig(appId, patch) + MenuBarItem.checked (dấu
  # check kiểu checkbox menu item). Cần cho tính năng bật/tắt "Dùng dữ liệu mẫu" (menu Develop,
  # module-ceremony) phản ánh trạng thái thật ngay trên menu — `apps` trong store đã đọc reactive
  # sẵn (MenuBar.tsx), chỉ thiếu 1 action để patch lại sau registerApps(), không cần cơ chế mới.
  "@sonth87/device-layout": "github:sonth87/device-layout#v0.5.3"

  # Thêm 2026-07-29 — audit dependency trùng lặp giữa modules/* + packages/*ui (dựng
  # packages/ui dùng chung: cn()/color picker/primitive Radix trùng lặp 3 nơi). lucide-react
  # là icon lib dùng trực tiếp ở NHIỀU module (không chỉ qua packages/ui) nên vẫn cần khai ở
  # từng package.json, nhưng version luôn khớp nhau — pin 1 chỗ theo đúng tiền lệ device-layout
  # ở trên, tránh phải sửa 7 package.json mỗi lần nâng version.
  "lucide-react": "^1.24.0"

onlyBuiltDependencies:
  - electron
  - esbuild
  - better-sqlite3
